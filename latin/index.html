<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="mtc" content="#f6f1e7">
<title>Latin in Two Years</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script>
/* Theme: follow Taskist when opened from it (?th=), otherwise remember last choice, otherwise the phone setting */
(function(){var q=new URLSearchParams(location.search),t=q.get('th');try{if(t)localStorage.setItem('latin.th',t);else t=localStorage.getItem('latin.th')}catch(e){}
 if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.th=t;
 if(q.get('from')==='taskist'){try{sessionStorage.setItem('latin.from','taskist')}catch(e){}}})();
</script>
<style>
/* ---- Lingua Latina colours (unchanged), Taskist layout & motion ---- */
:root{--bg:#f6f1e7;--card:#fffdf8;--card2:#efe7d8;--ink:#2a2420;--mute:#7a6f63;--line:#e4dccd;--acc:#8c2f1c;--acc2:#b5523b;--ok:#2f6b3a;--no:#a3321f;--soft:#f0e7d6;--prs:rgba(60,40,20,.08);--sh:0 1px 2px rgba(60,40,20,.05)}
:root[data-th=dark]{--bg:#1b1815;--card:#24201c;--card2:#2e2924;--ink:#ede6da;--mute:#a69b8d;--line:#3a332c;--acc:#e0866d;--acc2:#c96e55;--ok:#7fc28b;--no:#ec8a76;--soft:#2e2924;--prs:rgba(255,240,220,.1);--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"HarmonyOS Sans","Roboto",system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow-x:clip}
body{min-height:100vh;transition:background .3s,color .3s}
a{color:var(--acc)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* top bar: transparent, fills in and shows a small title once the big title scrolls away */
.bar0{position:fixed;top:0;left:0;right:0;z-index:20;height:56px;padding:0 6px calc(0px) 6px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:4px;background:transparent;transition:background .25s,box-shadow .25s}
.bar0.sc{background:var(--bg);box-shadow:0 1px 0 var(--line)}
.bar0 .tt{flex:1;min-width:0;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.3,1)}
.bar0.sc .tt{opacity:1;transform:none}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none;position:relative;transition:background .2s}
.ic:active{background:var(--prs)}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic[hidden]{display:none}
.strk{font-size:13px;color:var(--mute);padding:0 6px;white-space:nowrap}

#main{max-width:720px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
#main.mfo{opacity:0;transition:opacity .09s ease-in}
#main.mfi{animation:mfi .24s cubic-bezier(.2,.8,.3,1)}
@keyframes mfi{from{opacity:0;transform:translateY(8px)}}
@keyframes fdi{from{opacity:0;transform:translateY(-4px)}}

/* big titles like Taskist */
h1,h2{font-weight:600;letter-spacing:-.2px;line-height:1.15}
h1{font-size:32px;margin:6px 4px 6px}
h2{font-size:30px;margin:6px 4px 8px}
h3{font-size:17px;font-weight:600;margin:0 0 10px}
h4{font:600 12px/1.3 inherit;margin:22px 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
.sub,.note{color:var(--mute);font-size:14px}.sub{margin:0 4px 14px}.note{margin:6px 0}
.hero{padding:0 0 4px}.hero p{color:var(--mute);margin:0 4px}
.crumb{font-size:13.5px;color:var(--mute);margin:0 4px 2px}.crumb a{color:var(--acc);text-decoration:none;font-weight:500}

/* cards: borderless rounded surfaces */
.card{background:var(--card);border-radius:20px;padding:16px 16px;margin:12px 0;box-shadow:var(--sh)}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h3{margin:0;flex:1}
details.card>summary::after{content:'';width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translateY(-3px);transition:transform .25s cubic-bezier(.3,.9,.3,1);margin-right:4px}
details.card[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
details.card[open]>summary{margin-bottom:12px}
details[open]>*:not(summary){animation:fdi .25s cubic-bezier(.2,.8,.3,1)}

/* Today list = grouped rows */
.todo{display:flex;flex-direction:column;padding:12px 2px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);position:relative;border-radius:12px;transition:background .25s}
.todo:first-of-type{border-top:0}.todo span{color:var(--mute);font-size:14px}.todo b{color:var(--acc);font-weight:600}
.todo:after{content:'';position:absolute;right:6px;top:50%;width:8px;height:8px;border-right:2px solid var(--mute);border-top:2px solid var(--mute);transform:translateY(-50%) rotate(45deg);opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.stats div{background:var(--card);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--sh)}
.stats b{display:block;font:600 24px 'EB Garamond',serif;color:var(--ink)}.stats span{font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin:0 4px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .5s cubic-bezier(.3,.9,.3,1)}
.row{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.row:first-of-type{border:0}.row b{min-width:78px;color:var(--acc);font-weight:600}
.phase{border-top:1px solid var(--line);padding:10px 0}.phase:first-of-type{border-top:0}.phase summary{cursor:pointer;font-size:14px;list-style:none}.phase summary::-webkit-details-marker{display:none}.phase summary span{color:var(--mute)}.phase p{font-size:14px;margin:6px 0}
.phase.now summary b{color:var(--acc)}

/* lists: one rounded group with dividers, like Taskist settings */
.unit{margin:22px 4px 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;text-decoration:none;color:var(--ink);position:relative;transition:background .25s}
.li+.li:before{content:'';position:absolute;top:0;left:56px;right:16px;height:1px;background:var(--line)}
.li:active{background:var(--prs);transition:background .05s}
.li .num{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;transition:background .3s,color .3s}
.li.done .num{background:var(--acc);color:#fff}.li .tick{margin-left:auto;color:var(--ok)}.li span:nth-child(2){flex:1}
.li small{color:var(--mute)}

.lesson p,.lesson li{font-size:16px}.lesson ul,.lesson ol{padding-left:20px}
.lesson{margin:0 4px}
.la{font-family:'EB Garamond',serif;font-size:1.14em}
h2.la{font-size:34px;font-weight:600}
.ex{background:var(--card);padding:10px 14px;border-radius:14px;margin:10px 0;display:flex;flex-direction:column;box-shadow:inset 3px 0 0 var(--acc2),var(--sh)}
.ex .en{color:var(--mute);font-size:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0;border-radius:14px}
table.t{border-collapse:separate;border-spacing:0;font-size:14px;margin:10px 0;min-width:100%;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.scroll table.t{margin:0}
table.t caption{text-align:left;font:italic 15px 'EB Garamond',serif;color:var(--mute);padding:0 2px 6px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t th{background:var(--card2);font-weight:600;font-size:12.5px}
table.forms td:not(.cs){font-family:'EB Garamond',serif;font-size:16px;white-space:nowrap}
td.cs{color:var(--mute);font-size:12.5px;white-space:nowrap}
.mono{font-family:ui-monospace,monospace;font-size:13px;background:var(--card2);padding:8px;border-radius:10px;overflow-x:auto;white-space:nowrap}

/* buttons: Taskist pills with press feedback */
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:15px;padding:11px 20px;border-radius:24px;cursor:pointer;text-decoration:none;margin:6px 6px 0 0;transition:transform .15s,opacity .2s,filter .2s}
.btn:active{transform:scale(.96);filter:brightness(.92)}
.btn.ghost{background:var(--card2);color:var(--acc)}.btn.no{background:var(--no);color:#fff}
.btn:disabled{opacity:.5}
.pn{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt{text-align:left;background:var(--card2);border:0;color:var(--ink);padding:13px 16px;border-radius:16px;font-size:15px;cursor:pointer;transition:background .25s,box-shadow .25s,transform .12s}
.opt:active{transform:scale(.985)}
.opt.right{background:color-mix(in srgb,var(--ok) 18%,var(--card));box-shadow:inset 0 0 0 1.5px var(--ok)}.opt.wrong{background:color-mix(in srgb,var(--no) 16%,var(--card));box-shadow:inset 0 0 0 1.5px var(--no)}
.q{font-size:18px;font-weight:500;margin:4px 0}.qn{font-size:12px;color:var(--mute);margin:0}
.ok{color:var(--ok);font-weight:500}.no{color:var(--no);font-weight:500}.big{font:600 26px 'EB Garamond',serif}
#fb,#dfb,#wfb,#back{animation:fdi .25s}

/* segmented chips like Taskist filters */
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:6px 0 4px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:var(--card);color:var(--ink);padding:8px 15px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;box-shadow:var(--sh);transition:background .25s,color .25s}
.seg button.on{background:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 2px;font-size:14px}.chips label{display:flex;gap:6px;align-items:center}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:17px;height:17px}
.cfg{background:var(--card);border-radius:18px;padding:12px 16px;margin:8px 0;box-shadow:var(--sh)}.cfg summary{cursor:pointer;font-weight:500;font-size:14px}
.prompt{font-size:22px;margin:4px 0}.prompt small{font-size:14px;color:var(--mute)}
.ask{font-weight:600;color:var(--acc);margin:6px 0}
input:not([type]),input.search,textarea,select{width:100%;font:18px 'EB Garamond',serif;padding:12px 14px;border:0;border-radius:14px;background:var(--card2);color:var(--ink);margin:6px 0;outline:0;transition:box-shadow .2s}
input:not([type]):focus,input.search:focus,textarea:focus{box-shadow:inset 0 0 0 1.5px var(--acc)}
input.search{font:16px inherit;font-family:inherit}
select{font-size:15px;font-family:inherit}
.flash .front{font-size:30px;text-align:center;margin:22px 0}.flash .answer{font-size:21px;text-align:center;margin:10px 0 14px}
.flash{animation:fdi .3s}
.grade{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.wli{border-bottom:1px solid var(--line);padding:10px 16px}.wli:last-child{border-bottom:0}.wli summary{cursor:pointer;display:flex;flex-direction:column;list-style:none}.wli summary::-webkit-details-marker{display:none}.wli summary span:last-of-type{font-size:13px;color:var(--mute)}.wli i{color:var(--ok);font-style:normal;font-size:12px}
#wl.list{gap:0}
.text{font-size:21px;line-height:2}.w{cursor:pointer;border-radius:6px;padding:1px 3px;transition:background .2s,color .2s}.w:active{background:var(--prs)}.w.on{background:var(--acc);color:#fff}
.gloss{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));box-shadow:0 8px 30px rgba(0,0,0,.14)}
.gloss p{animation:fdi .2s}
details summary{cursor:pointer}

/* bottom bar: Taskist style with press box and circular colour sweep */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));isolation:isolate;box-shadow:0 -1px 0 var(--line)}
nav a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--mute);font-size:11px;font-weight:500;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .3s}
nav a:before{content:'';position:absolute;top:-6px;bottom:-6px;left:3px;right:3px;border-radius:16px;background:var(--prs);opacity:0;transition:opacity .3s ease-out;z-index:-1}
nav a.pr:before{opacity:1;transition:opacity .05s}
nav a.on{color:var(--acc)}
nav .ni{position:relative;width:24px;height:24px}
nav .ni>span{position:absolute;inset:0;display:grid;place-items:center}
nav svg{width:23px;height:23px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .nio svg{stroke:var(--mute)}
nav .nin svg{stroke:var(--acc);fill:color-mix(in srgb,var(--acc) 22%,transparent)}
nav .nin{clip-path:circle(0px at 18% 88%);transition:clip-path .42s cubic-bezier(.4,0,.2,1)}
nav a.on .nin{clip-path:circle(44px at 18% 88%)}
nav .nio{transition:opacity .12s .3s}nav a.on .nio{opacity:0}nav a:not(.on) .nio{transition-delay:0s}
nav.noan *,nav.noan{transition:none!important}
@media (min-width:760px){nav{max-width:720px;margin:0 auto;border-radius:24px 24px 0 0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="bar0" id="bar0">
 <button class="ic" id="hback" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
 <div class="tt" id="tt">Latin</div>
 <span class="strk" id="streak"></span>
 <a class="ic" href="#ref" aria-label="Tables" title="Tables"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M9.5 9.5V20"/></svg></a>
 <button class="ic" id="thm" aria-label="Switch light or dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
</header>
<main id="main"></main>
<nav id="nav">
<a href="#home" data-v="home"><span class="ni"><svg viewBox="0 0 24 24"><path d="M3.5 11l8.5-7 8.5 7v8.5a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span>Home</a>
<a href="#learn" data-v="l"><span class="ni"><svg viewBox="0 0 24 24"><path d="M4.5 5.5a2.5 2.5 0 0 1 2.5-2.5h12v15.5H7a2.5 2.5 0 0 0-2.5 2.5z"/><path d="M4.5 21V5.5"/></svg></span>Learn</a>
<a href="#drill" data-v="drill"><span class="ni"><svg viewBox="0 0 24 24"><path d="M13 2.5L4.5 14h7l-1 7.5L19 10h-7z"/></svg></span>Drill</a>
<a href="#words" data-v="words"><span class="ni"><svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="13.5" height="14" rx="2.5"/><path d="M7.5 3h11a2.5 2.5 0 0 1 2.5 2.5v11"/></svg></span>Words</a>
<a href="#read" data-v="read"><span class="ni"><svg viewBox="0 0 24 24"><path d="M2.5 5h6.5a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2.5zM21.5 5H15a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7.5z"/></svg></span>Read</a>
<a href="#write" data-v="write"><span class="ni"><svg viewBox="0 0 24 24"><path d="M12 20h8.5"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>Write</a>
</nav>
<script src="engine.js"></script>
<script src="vocab.js"></script>
<script src="lessons.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>

</body>
</html>
